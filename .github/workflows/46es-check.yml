name: 46es repository checks
on:
  pull_request:
    paths: ['46es/**', '.github/workflows/46es-check.yml']
  push:
    branches: [main]
    paths: ['46es/**', '.github/workflows/46es-check.yml']
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 46es/model/*.sc are Git LFS objects (46es/.gitattributes); the checks read the CAD itself. The objects
      # are cached by their ids so a run downloads only CAD it has not seen (LFS bandwidth quota).
      - run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 46es/requirements.txt
      # check_repository.py and smoke_test.py import the CAD generator and verifier (numpy/scipy/shapely/ezdxf).
      - run: python -m pip install --quiet -r 46es/requirements.txt
      - run: python -B 46es/tools/check_repository.py
      # Generator geometry without SolidCraft: mount profiles, bracket keep-outs, cover window vs committed records.
      - run: python -B 46es/tools/smoke_test.py
